lor:#000;background:#fff;margin:0}.next-error-h1{border-right:1px solid rgba(0,0,0,.3)}@media (prefers-color-scheme:dark){body{color:#fff;background:#000}.next-error-h1{border-right:1px solid rgba(255,255,255,.3)}}\"}}],[\"$\",\"h1\",null,{\"className\":\"next-error-h1\",\"style\":{\"display\":\"inline-block\",\"margin\":\"0 20px 0 0\",\"padding\":\"0 23px 0 0\",\"fontSize\":24,\"fontWeight\":500,\"verticalAlign\":\"top\",\"lineHeight\":\"49px\"},\"children\":404}],[\"$\",\"div\",null,{\"style\":{\"display\":\"inline-block\"},\"children\":[\"$\",\"h2\",null,{\"style\":{\"fontSize\":14,\"fontWeight\":400,\"lineHeight\":\"49px\",\"margin\":0},\"children\":\"This page could not be found.\"}]}]]}]}]],[]],\"forbidden\":\"$undefined\",\"unauthorized\":\"$undefined\"}]}]]}]]}],{\"children\":[[\"$\",\"$1\",\"c\",{\"children\":[[[\"$\",\"a\",null,{\"className\":\"skip-link\",\"href\":\"#主要内容\",\"children\":\"跳到主要内容\"}],[\"$\",\"$L4\",null,{}],[\"$\",\"$L5\",null,{\"title\":\"背景音乐\",\"src\":\"/background-music-v1.m4a\",\"volume\":0.18}],[\"$\",\"$L6\",null,{\"siteConfig\":{\"name\":\"我的小小世界\",\"title\":\"我在这里，收藏成为自己的痕迹。\",\"description\":\"欢迎你叩开这扇门，进入这个世界。\",\"welcome\":\"未曾谋面的，也终将会相遇。\",\"sideNote\":\"请慢慢走，世界与文字都不着急。\",\"music\":{\"title\":\"背景音乐\",\"src\":\"/background-music-v1.m4a\",\"volume\":0.18}},\"stories\":[{\"time\":\"很久以前\",\"title\":\"世界之初\",\"body\":[\"小时候，世界上有很多细碎的东西：\",\"一片没那么快消散掉的水渍、墨绿色的地板、有些昏暗的灯光、一句平常的话。\",\"\",\"这个世界建造于，一个云层很低的阴天。\",\"\",\"“爷爷确实是忘记了她的放学时间，说接到孩子的时候，另外一个小朋友哭得特别大声，但她眼泪都没掉哈哈哈。”\",\"“你把鸡蛋给你表哥吃，反正你也不爱吃。”\",\"“男孩子动手能力就是强，你看你表哥多厉害，没有图纸也能拼出这么多东西。”\",\"“你今晚自己到点就回楼上睡觉，爸爸有事要出去。”\",\"\",\"“打电话给她爸，我倒是要看看能不能管的了她了，简直无法无天。”\",\"“别告诉我，她爱怎么样就怎么样。”\",\"... ...\",\"\",\"这些声音落进很小的身体里，慢慢长成一种秩序。\",\"她把所有想要混杂在一起，以为只要足够喧闹，世界就会愿意多看她一眼。\",\"\",\"很久以后她才明白，那些混乱嘈杂的片段停留着，并不是她记性太好。\",\"只是那个孩子还站在那里，等有人叫出她的名字。\",\"她想等来一句：\",\"“你看，她多好。”\",\"\",\"她也想被炫耀，她也想，成为世界的中心。\"],\"weather\":{\"type\":\"cloudy\",\"label\":\"多云\",\"note\":\"云层很低，远处仍有一块草地亮着。\"}},{\"time\":\"后来\",\"title\":\"在世界穿行\",\"body\":[\"她开始在不同的光束间跳跃。\",\"\",\"当学生干部、站上舞台、拿起麦克风——有越来越多的光划过她的手心。\",\"\",\"旋律一次次响起，聚光灯一次次落下。\",\"那个等着有人叫出名字的孩子，终于在掌声里听见了自己的名字。\",\"\",\"她的成绩越来越好，性格越来越勇敢外向。\",\"世界不再只是昏暗的房间。它开始有风、有光，也有了一块小小的地方。\",\"\",\"她曾无数次感谢那段轻盈的时光。\",\"一个个明亮的光点聚集起来，越过云层，又落回她的眼睛。\",\"\",\"它们没有告诉她终点在哪里。\",\"只是在她向前时，照亮了更远的方向。\",\"\",\"当我穿过略微厚重的云层，触碰到耀眼的阳光，\",\"我想，我开始拥有世界了。\"],\"weather\":{\"type\":\"sunny\",\"label\":\"晴\",\"note\":\"光沿着草坡走得很远，适合跟随一次好奇。\"},\"sceneImage\":{\"desktop\":\"/world-sunny-dance-v1.jpg\",\"mobile\":\"/world-sunny-dance-mobile-v1.jpg\"}},{\"time\":\"有时候\",\"title\":\"把雨声变成我的声音\",\"body\":[\"世界偶尔也会下一场很长的雨。\",\"\",\"她站在风暴中央。\",\"风声、雨声、雷声，混着斥责、怒吼和嘲笑。\",\"那些没有说过的话、没有做过的事，也在雨里长出了陌生的形状。\",\"\",\"她开始怀疑所有明亮的东西。\",\"掌声是礼貌，赞美是保留，靠近也像下一场离开的序章。\",\"\",\"她把别人的目光一寸寸收进身体，最后成为了最苛责自己的那个人。\",\"\",\"直到很久以后，有人问：\",\"“你听见的，究竟是整个世界，还是一个人的回声？”\",\"\",\"她抬起头，忽然看见：\",\"原来风暴之外一直有人，雨幕之后也一直有太阳。\",\"\",\"她不再逼自己忘记。\",\"只是慢慢把别人的声音还给别人，把自己的名字还给自己。\",\"\",\"世界仍有阴雨天。\",\"但我不再因为一片乌云，害怕整个天空。\"],\"weather\":{\"type\":\"rainy\",\"label\":\"小雨\",\"note\":\"细雨让远处变得模糊，也让近处的事更清楚。\"}},{\"time\":\"此刻\",\"title\":\"继续成为\",\"body\":[\"世界没有尽头。\",\"\",\"我走过低垂的云、耀眼的晴天，也走过一场很长的雨。\",\"那些大大小小的经历并没有离开。\",\"它们变成风、变成光，也变成泥土，安静地汇聚成了现在的我。\",\"\",\"每一次抵达与离开，每一场欢喜与疼痛，都在我的世界里留下新的地形。\",\"有的沉积成平原，有的隆起为山，有的在很深的地方汇成河流。\",\"\",\"我有自己的潮汐与引力，也有尚未被命名的旷野。\",\"\",\"我的世界里，还有很多尚未结束的冒险。\",\"我一次次出发，也一次次拯救自己的世界。\",\"\",\"后来，每一次旋律响起，都是新生。\",\"光换了一种方式，继续照向远方。\",\"\",\"我拥有了自己的世界。\",\"而我还在往前走。\"],\"weather\":{\"type\":\"dusk\",\"label\":\"晴野\",\"note\":\"光线随着时间流转，世界也更加绚烂。\"},\"sceneImage\":{\"desktop\":\"/world-dusk-horizon-v2.jpg\",\"mobile\":\"/world-dusk-horizon-mobile-v2.jpg\"}}],\"articles\":[{\"slug\":\"room-for-the-unfinished\",\"title\":\"给未完成的事留一扇窗\",\"category\":\"生活札记\",\"date\":\"2026年8月2日\",\"summary\":\"我们常常急着给一段经历下结论，也许有些事更适合先被安静地放在窗边，等风替它翻页。\",\"readingTime\":\"约 4 分钟\",\"content\":[\"以前我总觉得，开始一件事就应该把它完成。未读完的书、写到一半的文章、没有继续的计划，都会像房间里没有收好的东西，让人忍不住想要归置整齐。\",\"后来我慢慢发现，有些暂停并不是放弃。它只是说明此刻的我，还没有足够的时间、经验或心力走到那里。与其仓促地写下结尾，不如给它留一扇窗，让新的空气和日后的自己都有机会进来。\",\"于是我开始接受生活里那些松开的线头。它们不再催促我，也不再证明什么。它们只是安静地提醒：人生不是一份需要逐项勾完的清单。\"],\"weather\":{\"type\":\"cloudy\",\"label\":\"多云\",\"note\":\"云层慢慢经过，窗缝里还有一点风。\"}},{\"slug\":\"walk-without-an-answer\",\"title\":\"没有答案的时候，就先去散步\",\"category\":\"日常观察\",\"date\":\"2026年7月18日\",\"summary\":\"许多困住我们的，并不是问题本身，而是我们要求自己立刻想明白。身体先向前走，思绪有时才会松开。\",\"readingTime\":\"约 3 分钟\",\"content\":[\"傍晚散步有一种很小的自由。你不必抵达哪里，也不用向谁解释此行的意义，只需要在天色完全暗下来以前，跟着一条路走一会儿。\",\"有些白天反复打结的问题，会在脚步稳定之后失去锋利的边缘。答案不一定出现，但你会重新看见问题之外的东西：树叶的背面、陌生人的笑声、从厨房窗口飘出来的一点热气。\",\"我喜欢这种没有结论的恢复。它让人明白，暂时想不清楚并不是失败，继续生活本身也能带来方向。\"],\"weather\":{\"type\":\"sunny\",\"label\":\"晴\",\"note\":\"天色清亮，适合沿着一条没有目的的路走走。\"}},{\"slug\":\"small-certain-things\",\"title\":\"一些微小而确定的事\",\"category\":\"片刻\",\"date\":\"2026年6月30日\",\"summary\":\"在变化太快的日子里，我开始重新辨认那些不宏大，却足以托住一个下午的东西。\",\"readingTime\":\"约 5 分钟\",\"content\":[\"所谓确定，并不一定意味着永远不变。它也可以是杯子落在桌面时熟悉的轻响，是常走的路在雨后泛起的泥土气味，是朋友在消息末尾留给你的那句“慢慢来”。\",\"这些事情太小了，小到很难被写进一份郑重其事的记录里。但正是它们，把一天从抽象的时间变成了可以触摸的生活。\",\"我想记住它们，不是因为害怕失去，而是因为在每一个并不特别的日子里，它们都曾真实地照亮过我。\"],\"weather\":{\"type\":\"rainy\",\"label\":\"小雨\",\"note\":\"细雨落在草叶上，微小的事因此变得清晰。\"}},{\"slug\":\"learning-to-wait\",\"title\":\"练习等待，也练习不等待\",\"category\":\"阶段思考\",\"date\":\"2026年5月12日\",\"summary\":\"有些事情需要耐心，有些事情需要出发。真正困难的，或许是分辨自己正站在哪一种时刻里。\",\"readingTime\":\"约 6 分钟\",\"content\":[\"等待并不总是温柔的。它有时来自谨慎，有时来自害怕；有时是在给一件事足够的时间，有时只是把选择交给了偶然。\",\"我还没有学会每次都分辨正确，但开始留意身体给出的信号：真正的耐心通常是安静的，而拖延会让人持续消耗。真正的出发未必激动，反而常常带着一种清醒的笃定。\",\"也许成长不是变得果断，而是在等待和行动之间，越来越能听见自己诚实的声音。\"],\"weather\":{\"type\":\"cloudy\",\"label\":\"阴转晴\",\"note\":\"云还没有完全散开，但远处已经亮了一些。\"}},{\"slug\":\"late-summer-desk\",\"title\":\"夏末的书桌上\",\"category\":\"阅读与写作\",\"date\":\"2026年4月26日\",\"summary\":\"一本读到一半的书、几页反复修改的字，以及一束从傍晚斜进来的光，组成了最近的生活。\",\"readingTime\":\"约 4 分钟\",\"content\":[\"书桌是一个很诚实的地方。它会留下最近的注意力：摊开的页码、写得太快而认不出的字、忘记喝完的一杯水，以及被压在最下面、其实一直惦记着的那张纸。\",\"我没有刻意整理它们。某种程度上，这些微小的凌乱正好保存了思考发生的顺序。写作也一样，它并非总从一个清晰的观点开始，更多时候只是把模糊的感觉放到光下，一点点看清。\",\"等到夏天真正结束，我希望留下的不是一篇完美的文章，而是仍愿意坐下来、继续写下一行的耐心。\"],\"weather\":{\"type\":\"sunny\",\"label\":\"晚晴\",\"note\":\"雨停以后，夏末的光斜斜落在书桌上。\"}}],\"thoughts\":[{\"text\":\"真正重要的改变，常常没有声音。它只是让你在下一次面对相同的路口时，做出了不同的选择。\",\"note\":\"关于成长\"},{\"text\":\"不必把每一种喜欢都变成擅长。有些事存在的意义，只是让日子多一个可以透气的地方。\",\"note\":\"关于热爱\"},{\"text\":\"我们以为自己在寻找答案，很多时候，其实是在寻找一个能够安心继续生活的角度。\",\"note\":\"关于问题\"},{\"text\":\"慢不是停留。慢是愿意把经过的地方看清楚，再带着它们继续往前。\",\"note\":\"关于时间\"}],\"projects\":[{\"name\":\"一封不定期的来信\",\"year\":\"2026—\",\"category\":\"长期写作\",\"description\":\"把最近读到的、想到的和认真生活过的片段，偶尔写成一封不追赶热点的信。\"},{\"name\":\"城市散步档案\",\"year\":\"2025—\",\"category\":\"个人记录\",\"description\":\"用路线、声音和短文保存一座城市不被地图标注的部分，也记下自己经过它们时的心情。\"},{\"name\":\"三十个小实验\",\"year\":\"2025\",\"category\":\"日常实践\",\"description\":\"围绕专注、表达与创造做的一组轻量实验。没有宏大的结论，只保留真实可复用的方法。\"},{\"name\":\"把复杂的事说清楚\",\"year\":\"持续进行\",\"category\":\"工作方法\",\"description\":\"练习把模糊的问题整理成可以理解、可以行动的表达，也记录那些真正有效的协作方式。\"}]}]],[\"$L7\"],\"$L8\"]}],{},null,false,null]},null,false,null],\"$L9\",false]],\"m\":\"$undefined\",\"G\":[\"$a\",[\"$Lb\"]],\"S\":true,\"h\":null,\"s\":\"$undefined\",\"l\":\"$undefined\",\"p\":\"$undefined\",\"d\":\"$undefined\",\"b\":\"kF8731nInBRyZRPx8WDoO\"}\n"])</script><script>self.__next_f.push([1,"c:I[77916,[\"/_next/static/chunks/0b-.ij0mqhtov.js\"],\"OutletBoundary\"]\nd:\"$Sreact.suspense\"\nf:I[77916,[\"/_next/static/chunks/0b-.ij0mqhtov.js\"],\"ViewportBoundary\"]\n11:I[77916,[\"/_next/static/chunks/0b-.ij0mqhtov.js\"],\"MetadataBoundary\"]\n7:[\"$\",\"script\",\"script-0\",{\"src\":\"/_next/static/chunks/0shc~wlu6mmpq.js\",\"async\":true,\"nonce\":\"$undefined\"}]\n8:[\"$\",\"$Lc\",null,{\"children\":[\"$\",\"$d\",null,{\"name\":\"Next.MetadataOutlet\",\"children\":\"$@e\"}]}]\n9:[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Lf\",null,{\"children\":\"$L10\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$L11\",null,{\"children\":[\"$\",\"$d\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L12\"}]}]}],null]}]\nb:[\"$\",\"link\",\"0\",{\"rel\":\"stylesheet\",\"href\":\"/_
